<h1>Adrian's Gig History</h1>
<div class="subtitle" id="subtitle"></div>

<div class="filters">

  <select id="f-category"><option value="">All Categories</option></select>

</div>

<div class="count" id="rowcount"></div>

<div class="stats-panel" id="stats-panel" hidden>

  </div>

      <div class="stats-legend" id="stats-legend"></div>
    </div>
    <div class="stats-chart-wrap" id="stats-chart-wrap">

      <div class="stats-tooltip" id="stats-tooltip" hidden></div>
    </div>
    <div class="stats-performers">
      <div class="stats-performers-title" id="stats-performers-title"></div>
      <div class="stats-performers-body">
        <div class="stats-pie-wrap" id="stats-pie-wrap">
          <svg class="stats-pie" id="stats-pie" viewBox="0 0 320 320"></svg>
          <div class="stats-tooltip" id="stats-pie-tooltip" hidden></div>
        </div>
        <div class="stats-performer-table-wrap">
          <table id="stats-performer-table">
            <thead>
              <tr>
                <th data-key="name">Show<span class="arrow"></span></th>
                <th data-key="count">Performances<span class="arrow"></span></th>
                <th class="stats-performer-table-spacer" aria-hidden="true"></th>
              </tr>
            </thead>
            <tbody id="stats-performer-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th data-key="date">Date<span class="arrow"></span></th>
        <th data-key="performer">Show<span class="arrow"></span></th>
        <th data-key="category">Category<span class="arrow"></span></th>

        <th data-key="country">Country<span class="arrow"></span></th>
        <th data-key="venue">Venue<span class="arrow"></span></th>
        <th data-key="show">Notes<span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

let sortKey = "date";
let sortDir = "desc"; // desc = newest first by default

const filters = { performer: "", category: "", city: "", country: "", venue: "" };
let searchTerm = "";

const filterIds = {
  performer: "f-performer",
  category: "f-category",
  city: "f-city",
  country: "f-country",
  venue: "f-venue"
};

function splitPerformers(str) {
  if (!str) return [];
  return str.split(",").map(s => s.trim()).filter(Boolean);
}

function matchesFilterKey(g, key, value) {
  if (key === "performer") {
    return splitPerformers(g.performer).includes(value) || splitPerformers(g.association).includes(value);
  }
  return g[key] === value;
}

// Options for a dropdown are drawn from rows matching every *other* active
// filter (search is deliberately excluded, per #118), so activating one
// filter narrows the rest without ever invalidating itself. Each option also
// carries a count of the gigs it would show, for the dropdown labels (#153).
function uniqueSorted(key) {
  let rows = GIGS;
  Object.keys(filters).forEach(otherKey => {
    if (otherKey === key || !filters[otherKey]) return;
    rows = rows.filter(g => matchesFilterKey(g, otherKey, filters[otherKey]));
  });
  const counts = new Map();
  const bump = v => counts.set(v, (counts.get(v) || 0) + 1);
  if (key === "performer") {
    rows.forEach(g => {
      const names = new Set([...splitPerformers(g.performer), ...splitPerformers(g.association)]);
      names.forEach(bump);
    });
  } else {
    rows.forEach(g => { if (g[key]) bump(g[key]); });
  }
  return Array.from(counts.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([value, count]) => ({ value, count }));
}

function attachFilterListeners() {
  Object.keys(filterIds).forEach(key => {
    const sel = document.getElementById(filterIds[key]);
    sel.addEventListener("change", () => {
      filters[key] = sel.value;
      populateFilters();
      render();
      // A <select> keeps matching :focus-visible after a real interaction
      // (unlike a <button>), so the shared focus/active outline (#108)
      // stays showing even once the value is back to "All..." and
      // .is-active has been removed. Blurring after commit clears it,
      // matching how the reset button already behaves.
      sel.blur();
    });
  });
}

function populateFilters() {
  Object.keys(filterIds).forEach(key => {
    const sel = document.getElementById(filterIds[key]);
    while (sel.options.length > 1) sel.remove(1);
    uniqueSorted(key).forEach(({ value, count }) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = count === 1 ? value : `${value} (${count})`;
      sel.appendChild(opt);
    });
    if (filters[key] && Array.from(sel.options).some(o => o.value === filters[key])) {
      sel.value = filters[key];
    } else {
      sel.value = "";
      filters[key] = "";
    }
  });
}

function applyFilters(rows) {
  return rows.filter(g => {
    const matchesDropdowns = Object.keys(filters).every(key => {
      if (!filters[key]) return true;
      return matchesFilterKey(g, key, filters[key]);
    });
    if (!matchesDropdowns) return false;
    if (!searchTerm) return true;
    const matchesOtherFields = ["date", "performer", "category", "city", "country", "venue", "show"]
      .some(key => (g[key] || "").toLowerCase().includes(searchTerm));
    const matchesAssociation = splitPerformers(g.association)
      .some(a => a.toLowerCase() === searchTerm);
    return matchesOtherFields || matchesAssociation;
  });
}

function compare(a, b, key) {
  let va = a[key] || "";
  let vb = b[key] || "";
  if (key === "date") {
    return va.localeCompare(vb);
  }
  return va.toLowerCase().localeCompare(vb.toLowerCase());
}

function sortRows(rows) {
  const sorted = [...rows].sort((a, b) => compare(a, b, sortKey));
  return sortDir === "asc" ? sorted : sorted.reverse();
}

function updateActiveIndicators() {
  let anyActive = searchTerm !== "";
  Object.keys(filterIds).forEach(key => {
    const isActive = !!filters[key];
    if (isActive) anyActive = true;
    document.getElementById(filterIds[key]).classList.toggle("is-active", isActive);
  });
  document.getElementById("search").classList.toggle("is-active", searchTerm !== "");
  document.getElementById("reset").classList.toggle("is-active", anyActive);
}

function render() {
  updateActiveIndicators();
  const filtered = applyFilters(GIGS);
  const sorted = sortRows(filtered);
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (sorted.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No gigs match these filters.</td></tr>';
  } else {
    sorted.forEach(g => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(g.date)}</td>
        <td>${performerLinksHtml(g.performer)}</td>
        <td><span class="cat-tag">${escapeHtml(g.category)}</span></td>
        <td>${filterLinkHtml("city", g.city)}</td>
        <td>${filterLinkHtml("country", g.country)}</td>
        <td>${filterLinkHtml("venue", g.venue)}</td>
        <td>${escapeHtml(g.show)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById("rowcount").textContent =
    `Showing ${sorted.length} of ${GIGS.length} gigs`;

  document.querySelectorAll(".table-scroll thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    if (th.dataset.key === sortKey) {
      arrow.textContent = sortDir === "asc" ? "▲" : "▼";
    } else {
      arrow.textContent = "";
    }
  });

  if (statsOpen) renderStats(filtered);
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g,"&quot;");
}

function performerLinksHtml(performer) {
  const artists = splitPerformers(performer);
  if (artists.length === 0) return "";
  return artists
    .map(a => `<a href="#" class="performer-link" data-artist="${escapeAttr(a)}">${escapeHtml(a)}</a>`)
    .join('<span class="performer-sep">, </span>');
}

function selectArtist(artist) {
  selectFilter("performer", artist);
}

function filterLinkHtml(key, value) {
  if (!value) return "";
  return `<a href="#" class="performer-link" data-filter-key="${escapeAttr(key)}" data-filter-value="${escapeAttr(value)}">${escapeHtml(value)}</a>`;
}

function selectFilter(key, value) {
  Object.keys(filters).forEach(k => { filters[k] = ""; });
  filters[key] = value;
  Object.keys(filterIds).forEach(k => {
    const sel = document.getElementById(filterIds[k]);
    sel.value = k === key ? value : "";
  });
  searchTerm = "";
  document.getElementById("search").value = "";
  populateFilters();
  render();
}

let currentStatsLayout = null;

let performerColorMap = new Map();
let performerSortKey = "count";
let performerSortDir = "desc";
let currentPerformerRows = [];
let currentPieSlices = [];

// Hue is assigned by a stable alphabetical order over every performer ever
// seen (not just the currently filtered ones), so a performer keeps the same
// colour whether the pie is showing all gigs or a narrow filter. The golden
// angle spreads hues apart even for a long list, and alternating lightness
// keeps hues that land close together (e.g. two names a few slots apart)
// visually distinct rather than just two shades of the same colour.
function buildPerformerColorMap() {
  const names = new Set();
  GIGS.forEach(g => splitPerformers(g.performer).forEach(p => names.add(p)));
  const sorted = Array.from(names).sort((a, b) => a.localeCompare(b));
  const map = new Map();
  sorted.forEach((name, i) => {
    const hue = (i * 137.508) % 360;
    // Lightness is kept in a narrow mid-range — dark enough to still read
    // against the light theme's cream panel, light enough to still read
    // against the dark theme's near-black one (colour here is generated in
    // JS, so it can't follow the site's light-dark() tokens the way the bar
    // chart's category colours do).
    const lightness = i % 2 === 0 ? 58 : 48;
    map.set(name, `hsl(${hue.toFixed(1)}, 65%, ${lightness}%)`);
  });
  return map;
}

function bucketByPerformer(rows) {
  const counts = new Map();
  rows.forEach(g => {
    splitPerformers(g.performer).forEach(p => {
      counts.set(p, (counts.get(p) || 0) + 1);
    });
  });
  return Array.from(counts.entries()).map(([name, count]) => ({
    name,
    count,
    color: performerColorMap.get(name) || "hsl(0, 0%, 60%)"
  }));
}

function sortPerformerRows(rows) {
  // Sort directly to the requested direction rather than sorting ascending
  // and reversing: reversing also flips the relative order of tied rows
  // (e.g. same performance count), which would put the table out of step
  // with the pie — that always sorts ties in first-appearance order.
  const dir = performerSortDir === "asc" ? 1 : -1;
  return [...rows].sort((a, b) => {
    const cmp = performerSortKey === "count"
      ? a.count - b.count
      : a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    return cmp * dir;
  });
}

function updatePerformersTitle() {
  const parts = statsFilterSummary();
  document.getElementById("stats-performers-title").textContent = parts.length === 0
    ? "Gigs by performer"
    : `Gigs by performer — filtered: ${parts.join(", ")}`;

function updatePerformerSortArrows() {

    } else {

    }

function renderPerformerTable(rows) {
  const tbody = document.getElementById("stats-performer-tbody");
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">No gigs match these filters.</td></tr>';
  } else {

      <tr data-performer="${escapeAttr(p.name)}">
        <td><span class="stats-swatch" style="background:${p.color}"></span><a href="#" class="performer-link" data-artist="${escapeAttr(p.name)}">${escapeHtml(p.name)}</a></td>
        <td>${p.count}</td>
        <td></td>
      </tr>
    `).join("");
  }
  updatePerformerSortArrows();
}

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function pieSlicePath(cx, cy, r, startAngle, endAngle) {
  // A single performer sweeps the full 360°, which the two-point arc syntax
  // below can't express (start and end points coincide) — drawn as two
  // half-circle arcs instead.
  if (endAngle - startAngle >= 359.999) {
    const p1 = polarPoint(cx, cy, r, startAngle);
    const pMid = polarPoint(cx, cy, r, startAngle + 180);
    return `M ${p1.x} ${p1.y} A ${r} ${r} 0 1 1 ${pMid.x} ${pMid.y} A ${r} ${r} 0 1 1 ${p1.x} ${p1.y} Z`;
  }
  const start = polarPoint(cx, cy, r, startAngle);
  const end = polarPoint(cx, cy, r, endAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
}

function drawPerformerPie(rows) {
  const svg = document.getElementById("stats-pie");
  const size = 320;
  const cx = size / 2, cy = size / 2, r = size / 2 - 8;

  if (rows.length === 0) {
    svg.innerHTML = `<text x="${cx}" y="${cy}" text-anchor="middle" class="stats-empty-text">No gigs match these filters.</text>`;
    currentPieSlices = [];
    return;
  }

  const total = rows.reduce((sum, p) => sum + p.count, 0);
  let angle = -90; // start at 12 o'clock, sweep clockwise
  const slices = rows.map(p => {
    const sweep = (p.count / total) * 360;
    const slice = { ...p, startAngle: angle, endAngle: angle + sweep };
    angle += sweep;
    return slice;
  });

  svg.innerHTML = slices.map(s => `
    <path d="${pieSlicePath(cx, cy, r, s.startAngle, s.endAngle)}" fill="${s.color}"
      class="stats-pie-slice" data-performer="${escapeAttr(s.name)}" />
  `).join("");
  currentPieSlices = slices;
}

function buildPieTooltipHtml(slice) {
  const gigWord = slice.count === 1 ? "gig" : "gigs";
  return `
    <div class="stats-tooltip-title">${escapeHtml(slice.name)}</div>
    <div class="stats-tooltip-row">
      <span class="stats-swatch" style="background:${slice.color}"></span>${slice.count} ${gigWord}
    </div>
  `;
}

function clearPerformerHighlight() {
  document.querySelectorAll("#stats-performer-tbody tr.stats-performer-row--highlight")
    .forEach(tr => tr.classList.remove("stats-performer-row--highlight"));
}

function highlightPerformerRow(name) {
  clearPerformerHighlight();
  const row = Array.from(document.querySelectorAll("#stats-performer-tbody tr"))
    .find(tr => tr.dataset.performer === name);
  if (row) row.classList.add("stats-performer-row--highlight");
}

function renderPerformerStats(rows) {
  updatePerformersTitle();
  currentPerformerRows = bucketByPerformer(rows);
  // The pie always shows biggest-first regardless of how the table is
  // sorted — the table is what the user is reordering, the pie is the
  // at-a-glance picture.
  drawPerformerPie([...currentPerformerRows].sort((a, b) => b.count - a.count));
  renderPerformerTable(sortPerformerRows(currentPerformerRows));
}

function monthsInRange(rows) {
  if (rows.length === 0) return [];
  const keys = rows.map(g => g.date.slice(0, 7)).sort();
  let [y, m] = keys[0].split("-").map(Number);
  const [endY, endM] = keys[keys.length - 1].split("-").map(Number);
  const months = [];
  while (y < endY || (y === endY && m <= endM)) {
    months.push(`${y}-${String(m).padStart(2, "0")}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return months;
}

function bucketByMonth(rows) {
  const months = monthsInRange(rows);
  const byMonth = new Map(months.map(month => [month, { month, total: 0, byCategory: {} }]));
  rows.forEach(g => {
    const bucket = byMonth.get(g.date.slice(0, 7));
    if (!bucket) return;
    bucket.total++;
    bucket.byCategory[g.category] = (bucket.byCategory[g.category] || 0) + 1;
  });
  return months.map(month => byMonth.get(month));
}

function monthLabel(month) {
  const [y, m] = month.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, 1))
    .toLocaleDateString("en-NZ", { month: "short", year: "2-digit", timeZone: "UTC" });
}

function computeYAxisTicks(maxTotal) {
  const targetTicks = 5;
  const step = Math.max(1, Math.ceil(maxTotal / targetTicks));
  const max = step * Math.ceil(maxTotal / step);
  const ticks = [];
  for (let t = 0; t <= max; t += step) ticks.push(t);
  return { max, ticks };
}

function statsFilterSummary() {
  const parts = Object.keys(filters)
    .filter(key => filters[key])
    .map(key => filters[key]);
  if (searchTerm) parts.push(`"${searchTerm}"`);
  return parts;
}

function updateStatsTitle() {
  const parts = statsFilterSummary();
  document.getElementById("stats-title").textContent = parts.length === 0
    ? "Gigs by month"
    : `Gigs by month — filtered: ${parts.join(", ")}`;
}

function renderStatsLegend() {
  document.getElementById("stats-legend").innerHTML = CATEGORY_ORDER.map(cat => `
    <span class="stats-legend-item">
      <span class="stats-swatch" style="background:var(${CATEGORY_VAR[cat]})"></span>${escapeHtml(cat)}
    </span>
  `).join("");
}

function buildTooltipHtml(bucket) {
  const rows = CATEGORY_ORDER
    .filter(cat => bucket.byCategory[cat])
    .map(cat => `
      <div class="stats-tooltip-row">
        <span class="stats-swatch" style="background:var(${CATEGORY_VAR[cat]})"></span>${escapeHtml(cat)}: ${bucket.byCategory[cat]}
      </div>
    `).join("");
  const gigWord = bucket.total === 1 ? "gig" : "gigs";
  return `<div class="stats-tooltip-title">${escapeHtml(monthLabel(bucket.month))} — ${bucket.total} ${gigWord}</div>${rows}`;
}

function drawStatsChart(buckets) {
  const svg = document.getElementById("stats-chart");
  // One viewBox unit equals one real CSS pixel — W tracks the chart's
  // actual rendered width so preserveAspectRatio="none" never has to
  // stretch the two axes by different factors. Text and stroke widths are
  // set in plain px, so a mismatched scale (the old fixed 960 viewBox
  // against a much wider desktop chart, issue 116) blew them up
  // horizontally. H matches the fixed height in gig-history.css.
  const W = Math.round(svg.getBoundingClientRect().width) || 960, H = 320;
  const marginLeft = 44, marginRight = 12, marginTop = 16, marginBottom = 34;
  const chartW = W - marginLeft - marginRight;
  const chartH = H - marginTop - marginBottom;
  const axisY = marginTop + chartH;

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  if (buckets.length === 0) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="stats-empty-text">No gigs match these filters.</text>`;
    currentStatsBuckets = [];
    currentStatsLayout = null;
    return;
  }

  const maxTotal = Math.max(...buckets.map(b => b.total));
  const { max: yMax, ticks } = computeYAxisTicks(maxTotal);
  const groupWidth = chartW / buckets.length;
  const barWidth = Math.min(groupWidth * 0.62, 48);
  // A fixed "one in every 12" thinning assumed the old constant-960 chart
  // width; on a narrow chart (mobile, or a collapsed sidebar) that still
  // crammed ~12 labels like "Mar 86" into far too little space and they
  // overlapped into an unreadable smear. Basing it on how many actually
  // fit at the label's real rendered width scales with the chart itself.
  const approxLabelWidth = 50;
  const maxLabels = Math.max(1, Math.floor(chartW / approxLabelWidth));
  const labelEvery = Math.max(1, Math.ceil(buckets.length / maxLabels));

  const parts = [];

  ticks.forEach(t => {
    const y = axisY - (t / yMax) * chartH;
    parts.push(`<line x1="${marginLeft}" y1="${y}" x2="${W - marginRight}" y2="${y}" class="stats-gridline" />`);
    parts.push(`<text x="${marginLeft - 8}" y="${y + 4}" text-anchor="end" class="stats-axis-label">${t}</text>`);
  });

  buckets.forEach((b, i) => {
    const x = marginLeft + i * groupWidth + (groupWidth - barWidth) / 2;
    let yCursor = axisY;
    const segments = CATEGORY_ORDER.map(cat => {
      const count = b.byCategory[cat] || 0;
      if (count === 0) return "";
      const segH = (count / yMax) * chartH;
      yCursor -= segH;
      return `<rect x="${x}" y="${yCursor}" width="${barWidth}" height="${segH}" fill="var(${CATEGORY_VAR[cat]})" />`;
    }).join("");
    const hitX = marginLeft + i * groupWidth;
    parts.push(`
      <g class="stats-bar-group" data-month="${b.month}">
        <rect x="${hitX}" y="${marginTop}" width="${groupWidth}" height="${chartH}" class="stats-hit-area" />
        ${segments}
      </g>
    `);
    if (i % labelEvery === 0) {
      parts.push(`<text x="${x + barWidth / 2}" y="${H - marginBottom + 16}" text-anchor="middle" class="stats-axis-label">${monthLabel(b.month)}</text>`);
    }
  });

  parts.push(`<line x1="${marginLeft}" y1="${axisY}" x2="${W - marginRight}" y2="${axisY}" class="stats-axis-line" />`);

  // Hidden until the mousemove handler positions and shows them over a bar
  // with a non-zero total (#121).
  parts.push(`<line id="stats-crosshair-x" x1="0" y1="${marginTop}" x2="0" y2="${axisY}" class="stats-crosshair" style="display:none" />`);
  parts.push(`<line id="stats-crosshair-y" x1="${marginLeft}" y1="0" x2="${W - marginRight}" y2="0" class="stats-crosshair" style="display:none" />`);

  svg.innerHTML = parts.join("");
  currentStatsBuckets = buckets;
  currentStatsLayout = { marginLeft, marginRight, marginTop, axisY, chartH, groupWidth, yMax };
}

let statsMap = null;
let statsMapMarkers = null;

/**
 * Groups rows by exact resolved coordinates (two gigs at the same location
 * always share the same lat/lng — no distance-based clustering needed) and
 * drops one marker per location, its divIcon showing the gig count. Rows
 * with no resolved location (see gigTrackerApp.mjs's build-time warning) are
 * silently excluded — there is nowhere on the map to put them.
 *
 * With a City or Venue filter active, markers sit at venue precision
 * (row.lat/lng) and render in the venue accent colour. Otherwise every gig
 * collapses onto its city's pin (row.cityLat/cityLng) in the default accent
 * colour — two gigs at different venues in the same city should read as one
 * marker showing "2", not two separate pins.
 */
function renderStatsMap(rows) {
  const cityLevel = !filters.city && !filters.venue;
  const byLocation = new Map();
  for (const row of rows) {
    const lat = cityLevel ? row.cityLat : row.lat;
    const lng = cityLevel ? row.cityLng : row.lng;
    if (typeof lat !== "number" || typeof lng !== "number") continue;
    const key = `${lat},${lng}`;
    if (!byLocation.has(key)) {
      byLocation.set(key, { lat, lng, venue: row.venue, city: row.city, gigs: [] });
    }
    byLocation.get(key).gigs.push(row);
  }

  const wrap = document.getElementById("stats-map-wrap");
  if (byLocation.size === 0) {
    wrap.hidden = true;
    return;
  }
  wrap.hidden = false;

  if (!statsMap) {
    statsMap = L.map("stats-map", { attributionControl: true, scrollWheelZoom: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors",
      maxZoom: 18
    }).addTo(statsMap);
    statsMapMarkers = L.featureGroup().addTo(statsMap);
  }
  // The container is `hidden` until now, so Leaflet measured it as 0x0 on
  // any earlier init — recheck its real size before placing markers.
  statsMap.invalidateSize();

  statsMapMarkers.clearLayers();
  for (const location of byLocation.values()) {
    // In venue-precision mode, a gig with no coordinates of its own falls
    // back to the city point (see hasVenueLocation in gigTrackerApp.mjs) and
    // lands in the same group as any other gig doing the same — location.venue
    // is then just whichever gig happened to be pushed first, so it can't be
    // trusted as the marker's label.
    const hasFallback = !cityLevel && location.gigs.some((gig) => !gig.hasVenueLocation);
    let label = location.city;
    if (hasFallback) {
      label = `Unknown address, ${location.city}`;
    } else if (!cityLevel && location.venue) {
      label = `${location.venue}, ${location.city}`;
    }
    const icon = L.divIcon({
      className: "gig-map-marker-wrap",
      // title gives a native hover tooltip and a hook for tests — Leaflet's
      // own bindTooltip below isn't in the DOM until actually shown.
      html: `<span class="gig-map-marker${cityLevel ? "" : " gig-map-marker--venue"}" title="${escapeAttr(label)}">${location.gigs.length}</span>`,
      iconSize: [28, 28]
    });
    const gigsLabel = `${location.gigs.length} gig${location.gigs.length === 1 ? "" : "s"}`;
    // Only city-level markers are clickable — at venue precision the label
    // is "Venue, City", not a clean "click the city" target. The city name
    // is styled like a link for the affordance, but the click target is the
    // marker itself: Leaflet closes the tooltip as soon as the mouse leaves
    // the marker, which happens before the cursor can reach text inside it.
    const tooltipContent = cityLevel
      ? `<span class="gig-map-city-label">${escapeHtml(location.city)}</span> — ${gigsLabel}`
      : `${label} — ${gigsLabel}`;
    const marker = L.marker([location.lat, location.lng], { icon })
      .bindTooltip(tooltipContent)
      .addTo(statsMapMarkers);
    if (cityLevel) marker.on("click", () => selectFilter("city", location.city));
  }
  statsMap.fitBounds(statsMapMarkers.getBounds(), { padding: [24, 24], maxZoom: 15 });
}

function renderStats(filteredRows) {
  const rows = filteredRows || applyFilters(GIGS);
  updateStatsTitle();
  renderStatsLegend();
  renderStatsMap(rows);
  const wrap = document.getElementById("stats-chart-wrap");
  wrap.classList.add("stats-chart-wrap--updating");
  drawStatsChart(bucketByMonth(rows));
  requestAnimationFrame(() => wrap.classList.remove("stats-chart-wrap--updating"));
  renderPerformerStats(rows);
}

const statsToggle = document.getElementById("stats-toggle");
const statsPanel = document.getElementById("stats-panel");

function hideStatsPanelIfClosed() {
  // Guards against a stale transitionend from a previous close firing after
  // a quick reopen has already set hidden = false — without this check that
  // late event would hide the panel again despite --open being applied.
  if (!statsOpen) statsPanel.hidden = true;
}

statsToggle.addEventListener("click", () => {
  statsOpen = !statsOpen;
  statsToggle.classList.toggle("is-active", statsOpen);
  if (statsOpen) {
    statsPanel.hidden = false;
    renderStats();
    requestAnimationFrame(() => statsPanel.classList.add("stats-panel--open"));
  } else {
    statsPanel.classList.remove("stats-panel--open");
    statsPanel.addEventListener("transitionend", hideStatsPanelIfClosed, { once: true });
    // Touch taps leave the button matching :focus-visible longer than a
    // mouse click does, so on mobile the shared focus/active outline (#108)
    // stuck showing after close. Blurring after commit clears it, matching
    // how the filter <select>s already behave (see attachFilterListeners).
    statsToggle.blur();
  }
});

const statsChartWrap = document.getElementById("stats-chart-wrap");
const statsTooltip = document.getElementById("stats-tooltip");
// Matches gig-history.css's mobile breakpoint. Disabled at that width for now
// (#135) — the tooltip/crosshair overlay gets crowded on a chart with lots of
// gigs in a wide date range; it'll come back reworked for mobile later.
const statsMobileQuery = window.matchMedia("(max-width: 47.999em)");

function hideCrosshair() {
  const x = document.getElementById("stats-crosshair-x");
  const y = document.getElementById("stats-crosshair-y");
  if (x) x.style.display = "none";
  if (y) y.style.display = "none";
}

function showCrosshair(group, bucket) {
  const x = document.getElementById("stats-crosshair-x");
  const y = document.getElementById("stats-crosshair-y");
  if (!x || !y || !currentStatsLayout) return;
  const { marginTop, axisY, chartH, groupWidth, yMax } = currentStatsLayout;
  const hitX = Number(group.querySelector(".stats-hit-area").getAttribute("x"));
  const centerX = hitX + groupWidth / 2;
  const topY = axisY - (bucket.total / yMax) * chartH;

  x.setAttribute("x1", centerX);
  x.setAttribute("x2", centerX);
  x.setAttribute("y1", marginTop);
  x.setAttribute("y2", axisY);
  x.style.display = "";

  y.setAttribute("y1", topY);
  y.setAttribute("y2", topY);
  y.style.display = "";
}

statsChartWrap.addEventListener("mousemove", (e) => {
  if (statsMobileQuery.matches) { statsTooltip.hidden = true; hideCrosshair(); return; }
  const group = e.target.closest(".stats-bar-group");
  if (!group) { statsTooltip.hidden = true; hideCrosshair(); return; }
  const bucket = currentStatsBuckets.find(b => b.month === group.dataset.month);
  // A bucket with no gigs still has a hit area (spanning the full column so
  // hovering next to its neighbours' bars is forgiving), but there is
  // nothing to show a tooltip or crosshair for (#122).
  if (!bucket || bucket.total === 0) { statsTooltip.hidden = true; hideCrosshair(); return; }
  statsTooltip.innerHTML = buildTooltipHtml(bucket);
  statsTooltip.hidden = false;
  showCrosshair(group, bucket);

  // Clamp to the viewport (position: fixed is viewport-relative) so the
  // tooltip never runs off the right/bottom edge for bars near either side
  // of the chart.
  const margin = 12;
  const ttRect = statsTooltip.getBoundingClientRect();
  let left = e.clientX + margin;
  let top = e.clientY + margin;
  if (left + ttRect.width > window.innerWidth - margin) {
    left = e.clientX - ttRect.width - margin;
  }
  if (top + ttRect.height > window.innerHeight - margin) {
    top = e.clientY - ttRect.height - margin;
  }
  statsTooltip.style.left = `${Math.max(margin, left)}px`;
  statsTooltip.style.top = `${Math.max(margin, top)}px`;
});

statsChartWrap.addEventListener("mouseleave", () => { statsTooltip.hidden = true; hideCrosshair(); });

const statsPieWrap = document.getElementById("stats-pie-wrap");
const statsPieTooltip = document.getElementById("stats-pie-tooltip");

function positionTooltip(tooltip, e) {
  const margin = 12;
  const ttRect = tooltip.getBoundingClientRect();
  let left = e.clientX + margin;
  let top = e.clientY + margin;
  if (left + ttRect.width > window.innerWidth - margin) {
    left = e.clientX - ttRect.width - margin;
  }
  if (top + ttRect.height > window.innerHeight - margin) {
    top = e.clientY - ttRect.height - margin;
  }
  tooltip.style.left = `${Math.max(margin, left)}px`;
  tooltip.style.top = `${Math.max(margin, top)}px`;
}

statsPieWrap.addEventListener("mousemove", (e) => {
  if (statsMobileQuery.matches) { statsPieTooltip.hidden = true; clearPerformerHighlight(); return; }
  const path = e.target.closest(".stats-pie-slice");
  if (!path) { statsPieTooltip.hidden = true; clearPerformerHighlight(); return; }
  const slice = currentPieSlices.find(s => s.name === path.dataset.performer);
  if (!slice) { statsPieTooltip.hidden = true; clearPerformerHighlight(); return; }
  statsPieTooltip.innerHTML = buildPieTooltipHtml(slice);
  statsPieTooltip.hidden = false;
  highlightPerformerRow(slice.name);
  positionTooltip(statsPieTooltip, e);
});

statsPieWrap.addEventListener("mouseleave", () => { statsPieTooltip.hidden = true; clearPerformerHighlight(); });

document.querySelectorAll("#stats-performer-table thead th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (performerSortKey === key) {
      performerSortDir = performerSortDir === "asc" ? "desc" : "asc";
    } else {
      performerSortKey = key;
      performerSortDir = key === "count" ? "desc" : "asc";
    }
    renderPerformerTable(sortPerformerRows(currentPerformerRows));
  });
});

// The chart's viewBox tracks its rendered width (see drawStatsChart), so a
// window resize needs a redraw or the old viewBox stays stretched against
// the new width.
window.addEventListener("resize", () => {
  if (statsOpen && currentStatsBuckets.length > 0) drawStatsChart(currentStatsBuckets);
});

function handlePerformerLinkClick(e) {
  const link = e.target.closest(".performer-link");
  if (!link) return;
  e.preventDefault();
  if (link.dataset.artist) {
    selectArtist(link.dataset.artist);
  } else if (link.dataset.filterKey) {
    selectFilter(link.dataset.filterKey, link.dataset.filterValue);
  }
}

document.getElementById("tbody").addEventListener("click", handlePerformerLinkClick);
document.getElementById("stats-performer-tbody").addEventListener("click", handlePerformerLinkClick);
document.getElementById("stats-map").addEventListener("click", handlePerformerLinkClick);

document.querySelectorAll(".table-scroll thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = key;
      sortDir = key === "date" ? "desc" : "asc";
    }
    render();
  });
});

function resetDropdownFilters() {
  Object.keys(filters).forEach(key => {
    filters[key] = "";
    document.getElementById(filterIds[key]).value = "";
  });
}

document.getElementById("reset").addEventListener("click", () => {
  resetDropdownFilters();
  populateFilters();
  searchTerm = "";
  document.getElementById("search").value = "";
  render();
});

const searchInput = document.getElementById("search");

searchInput.addEventListener("focus", () => {
  resetDropdownFilters();
  populateFilters();
  render();
});

searchInput.addEventListener("input", () => {
  searchTerm = searchInput.value.trim().toLowerCase();
  render();
});

function updateSubtitle() {
  const dates = GIGS.map(g => g.date).sort();
  document.getElementById("subtitle").textContent =
    `${GIGS.length} gigs from ${dates[0]} to ${dates[dates.length - 1]}`;
}

function parseGigMarkdown(text) {
  const lines = text.split("\n");
  const rows = [];
  let started = false;
  for (let raw of lines) {
    const line = raw.replace(/\r$/, "");
    if (line.startsWith("| Date")) { started = true; continue; }
    if (!started) continue;
    if (line.startsWith("|---")) continue;
    const trimmed = line.trim();
    if (!trimmed.startsWith("|")) continue;
    const parts = trimmed.replace(/^\|+/, "").replace(/\|+$/, "")
      .split("|").map(p => p.trim());
    if (parts.length === 8) {
      const [date, performer, category, city, country, venue, show, association] = parts;
      rows.push({ date, performer, category, city, country, venue, show, association });
    } else if (parts.length === 7) {
      const [date, performer, category, city, country, venue, show] = parts;
      rows.push({ date, performer, category, city, country, venue, show });
    } else if (parts.length === 6) {
      const [date, performer, city, country, venue, show] = parts;
      rows.push({ date, performer, category: "Music", city, country, venue, show });
    }
  }
  return rows;
}

function rebuildFrom(parsed) {
  GIGS = [];
  Object.keys(filters).forEach(key => { filters[key] = ""; });
  Object.values(filterIds).forEach(id => { document.getElementById(id).value = ""; });
  searchTerm = "";
  document.getElementById("search").value = "";
  sortKey = "date";
  sortDir = "desc";
  document.getElementById("tbody").innerHTML = "";

  GIGS = parsed;
  performerColorMap = buildPerformerColorMap();
  populateFilters();
  updateSubtitle();
  render();
}

async function reloadData() {
  const status = document.getElementById("reload-status");
  const btn = document.getElementById("reload");
  btn.disabled = true;
  status.textContent = "Reloading…";
  try {
    const res = await fetch("gig-history.md", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = parseGigMarkdown(text);
    if (parsed.length === 0) throw new Error("No rows found");
    rebuildFrom(parsed);
    status.textContent = `Reloaded ${GIGS.length} gigs just now.`;
    btn.disabled = false;
  } catch (err) {
    status.textContent = "Couldn't reload automatically — choose gig-history.md from the file picker.";
    btn.disabled = false;
    document.getElementById("file-input").click();
  }
}

document.getElementById("reload").addEventListener("click", reloadData);

document.getElementById("file-input").addEventListener("change", (e) => {
  const status = document.getElementById("reload-status");
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseGigMarkdown(reader.result);
    if (parsed.length === 0) {
      status.textContent = "That file didn't look like gig-history.md — no rows found.";
      return;
    }
    rebuildFrom(parsed);
    status.textContent = `Reloaded ${GIGS.length} gigs from the selected file.`;
  };
  reader.onerror = () => {
    status.textContent = "Couldn't read that file.";
  };
  reader.readAsText(file);
  e.target.value = "";
});

updateSubtitle();
performerColorMap = buildPerformerColorMap();
attachFilterListeners();
populateFilters();
render();
</script>
</body>
</html>
