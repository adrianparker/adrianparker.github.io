lington", "country": "New Zealand", "venue": "Athletic Park", "show": ""}];

let sortKey = "date";
let sortDir = "desc"; // desc = newest first by default

const filters = { performer: "", category: "", city: "", country: "", venue: "", show: "" };
let searchTerm = "";

const filterIds = {
  performer: "f-performer",
  category: "f-category",
  city: "f-city",
  country: "f-country",
  venue: "f-venue",
  show: "f-show"
};

function splitPerformers(str) {
  if (!str) return [];
  return str.split(",").map(s => s.trim()).filter(Boolean);
}

// City options narrow to the selected Country; Venue options narrow to the
// selected Country and/or City. Every other dropdown always lists every
// value seen across all of GIGS.
function uniqueSorted(key) {
  let rows = GIGS;
  if (key === "city" && filters.country) {
    rows = rows.filter(g => g.country === filters.country);
  }
  if (key === "venue") {
    if (filters.country) rows = rows.filter(g => g.country === filters.country);
    if (filters.city) rows = rows.filter(g => g.city === filters.city);
  }
  const vals = new Set();
  if (key === "performer") {
    rows.forEach(g => splitPerformers(g.performer).forEach(p => vals.add(p)));
  } else {
    rows.forEach(g => { if (g[key]) vals.add(g[key]); });
  }
  return Array.from(vals).sort((a,b) => a.localeCompare(b));
}

function attachFilterListeners() {
  Object.keys(filterIds).forEach(key => {
    const sel = document.getElementById(filterIds[key]);
    sel.addEventListener("change", () => {
      filters[key] = sel.value;
      // Changing Country or City can invalidate the current City/Venue
      // selection, so rebuild every dropdown's option list (populateFilters
      // also clears any selection that's no longer valid).
      if (key === "country" || key === "city") {
        populateFilters();
      }
      render();
    });
  });
}

function populateFilters() {
  Object.keys(filterIds).forEach(key => {
    const sel = document.getElementById(filterIds[key]);
    // remove all options except the first ("All ...") placeholder
    while (sel.options.length > 1) sel.remove(1);
    uniqueSorted(key).forEach(val => {
      const opt = document.createElement("option");
      opt.value = val;
      opt.textContent = val;
      sel.appendChild(opt);
    });
    // keep current filter value selected if it's still a valid option
    if (filters[key] && Array.from(sel.options).some(o => o.value === filters[key])) {
      sel.value = filters[key];
    } else {
      sel.value = "";
      filters[key] = "";
    }
  });
}

function applyFilters(rows) {
  return rows.filter(g => {
    const matchesDropdowns = Object.keys(filters).every(key => {
      if (!filters[key]) return true;
      if (key === "performer") return splitPerformers(g.performer).includes(filters[key]);
      return g[key] === filters[key];
    });
    if (!matchesDropdowns) return false;
    if (!searchTerm) return true;
    return ["date", "performer", "category", "city", "country", "venue", "show"]
      .some(key => (g[key] || "").toLowerCase().includes(searchTerm));
  });
}

function compare(a, b, key) {
  let va = a[key] || "";
  let vb = b[key] || "";
  if (key === "date") {
    return va.localeCompare(vb);
  }
  return va.toLowerCase().localeCompare(vb.toLowerCase());
}

function sortRows(rows) {
  const sorted = [...rows].sort((a, b) => compare(a, b, sortKey));
  return sortDir === "asc" ? sorted : sorted.reverse();
}

function render() {
  const filtered = applyFilters(GIGS);
  const sorted = sortRows(filtered);
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (sorted.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No gigs match these filters.</td></tr>';
  } else {
    sorted.forEach(g => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(g.date)}</td>
        <td>${performerLinksHtml(g.performer)}</td>
        <td><span class="cat-tag">${escapeHtml(g.category)}</span></td>
        <td>${filterLinkHtml("city", g.city)}</td>
        <td>${filterLinkHtml("country", g.country)}</td>
        <td>${filterLinkHtml("venue", g.venue)}</td>
        <td>${escapeHtml(g.show)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById("rowcount").textContent =
    `Showing ${sorted.length} of ${GIGS.length} gigs`;

  document.querySelectorAll("thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    if (th.dataset.key === sortKey) {
      arrow.textContent = sortDir === "asc" ? "▲" : "▼";
    } else {
      arrow.textContent = "";
    }
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g,"&quot;");
}

// Renders each comma-separated artist in a Performer cell as its own
// clickable link, so clicking one artist filters the table to just their gigs.
function performerLinksHtml(performer) {
  const artists = splitPerformers(performer);
  if (artists.length === 0) return "";
  return artists
    .map(a => `<a href="#" class="performer-link" data-artist="${escapeAttr(a)}">${escapeHtml(a)}</a>`)
    .join('<span class="performer-sep">, </span>');
}

// Clicking an artist link: clear every other filter, filter to just that
// artist, and reflect the selection in the Performer dropdown.
function selectArtist(artist) {
  selectFilter("performer", artist);
}

// Renders a single-value cell (city, country, venue) as a clickable link
// that filters the table down to that exact value.
function filterLinkHtml(key, value) {
  if (!value) return "";
  return `<a href="#" class="performer-link" data-filter-key="${escapeAttr(key)}" data-filter-value="${escapeAttr(value)}">${escapeHtml(value)}</a>`;
}

// Clears every other filter and search, sets a single filter, and reflects
// the selection in that field's dropdown.
function selectFilter(key, value) {
  Object.keys(filters).forEach(k => { filters[k] = ""; });
  filters[key] = value;
  Object.keys(filterIds).forEach(k => {
    const sel = document.getElementById(filterIds[k]);
    sel.value = k === key ? value : "";
  });
  searchTerm = "";
  document.getElementById("search").value = "";
  // Rebuild dropdown options so City/Venue reflect whichever filter was
  // just set (e.g. clicking a Country link should narrow City/Venue).
  populateFilters();
  render();
}

document.getElementById("tbody").addEventListener("click", (e) => {
  const link = e.target.closest(".performer-link");
  if (!link) return;
  e.preventDefault();
  if (link.dataset.artist) {
    selectArtist(link.dataset.artist);
  } else if (link.dataset.filterKey) {
    selectFilter(link.dataset.filterKey, link.dataset.filterValue);
  }
});

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = key;
      sortDir = key === "date" ? "desc" : "asc";
    }
    render();
  });
});

// Clears the dropdown filters (not the search box) and re-renders.
function resetDropdownFilters() {
  Object.keys(filters).forEach(key => {
    filters[key] = "";
    document.getElementById(filterIds[key]).value = "";
  });
}

document.getElementById("reset").addEventListener("click", () => {
  resetDropdownFilters();
  // Country/City are back to "", so this also restores the full,
  // un-narrowed City/Venue option lists.
  populateFilters();
  searchTerm = "";
  document.getElementById("search").value = "";
  render();
});

const searchInput = document.getElementById("search");

// Focusing the search box resets the rest of the view, so search always
// starts from the full unfiltered table.
searchInput.addEventListener("focus", () => {
  resetDropdownFilters();
  populateFilters();
  render();
});

searchInput.addEventListener("input", () => {
  searchTerm = searchInput.value.trim().toLowerCase();
  render();
});

function updateSubtitle() {
  const dates = GIGS.map(g => g.date).sort();
  document.getElementById("subtitle").textContent =
    `${GIGS.length} gigs from ${dates[0]} to ${dates[dates.length - 1]}`;
}

// Parses the "| Date | Performer | Category | City | Country | Venue | Show / Festival |"
// markdown table in gig-history.md into the same row shape used by GIGS.
// A few historical rows are missing the Category column (6 fields instead of 7);
// those are treated as "Music", matching how the table was originally generated.
function parseGigMarkdown(text) {
  const lines = text.split("\n");
  const rows = [];
  let started = false;
  for (let raw of lines) {
    const line = raw.replace(/\r$/, "");
    if (line.startsWith("| Date")) { started = true; continue; }
    if (!started) continue;
    if (line.startsWith("|---")) continue;
    const trimmed = line.trim();
    if (!trimmed.startsWith("|")) continue;
    const parts = trimmed.replace(/^\|+/, "").replace(/\|+$/, "")
      .split("|").map(p => p.trim());
    if (parts.length === 7) {
      const [date, performer, category, city, country, venue, show] = parts;
      rows.push({ date, performer, category, city, country, venue, show });
    } else if (parts.length === 6) {
      const [date, performer, city, country, venue, show] = parts;
      rows.push({ date, performer, category: "Music", city, country, venue, show });
    }
  }
  return rows;
}

// Wipes all in-memory state and DOM before rebuilding, so nothing from a
// previous load (stale rows, filter selections, sort order) survives.
function rebuildFrom(parsed) {
  GIGS = [];
  Object.keys(filters).forEach(key => { filters[key] = ""; });
  Object.values(filterIds).forEach(id => { document.getElementById(id).value = ""; });
  searchTerm = "";
  document.getElementById("search").value = "";
  sortKey = "date";
  sortDir = "desc";
  document.getElementById("tbody").innerHTML = "";

  GIGS = parsed;
  populateFilters();
  updateSubtitle();
  render();
}

// Some environments (e.g. viewing this page inside an app preview) block
// fetch() from reaching sibling files on disk. In that case we fall back to
// asking the person to pick gig-history.md by hand via a file input, which
// works everywhere because it's a direct user-initiated file read.
async function reloadData() {
  const status = document.getElementById("reload-status");
  const btn = document.getElementById("reload");
  btn.disabled = true;
  status.textContent = "Reloading…";
  try {
    const res = await fetch("gig-history.md", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = parseGigMarkdown(text);
    if (parsed.length === 0) throw new Error("No rows found");
    rebuildFrom(parsed);
    status.textContent = `Reloaded ${GIGS.length} gigs just now.`;
    btn.disabled = false;
  } catch (err) {
    status.textContent = "Couldn't reload automatically — choose gig-history.md from the file picker.";
    btn.disabled = false;
    document.getElementById("file-input").click();
  }
}

document.getElementById("reload").addEventListener("click", reloadData);

document.getElementById("file-input").addEventListener("change", (e) => {
  const status = document.getElementById("reload-status");
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseGigMarkdown(reader.result);
    if (parsed.length === 0) {
      status.textContent = "That file didn't look like gig-history.md — no rows found.";
      return;
    }
    rebuildFrom(parsed);
    status.textContent = `Reloaded ${GIGS.length} gigs from the selected file.`;
  };
  reader.onerror = () => {
    status.textContent = "Couldn't read that file.";
  };
  reader.readAsText(file);
  e.target.value = "";
});

updateSubtitle();
attachFilterListeners();
populateFilters();
render();
</script>
