version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Eleventy and its plugins move together; a single PR is easier to
      # verify against the visual regression suite than four separate ones.
      eleventy:
        patterns:
          - "@11ty/*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
