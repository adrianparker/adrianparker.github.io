name: Build and deploy

on:
  push:
    branches:
      - master

# Never let two deploys race; the later push should win.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      indexnow-payload: ${{ steps.indexnow.outputs.payload }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and coverage gate
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:headless

      - name: Validate HTML
        run: npm run lint:html

      # Compares the new build with what is still live, so it must run
      # before deploy. Never fails the build: no payload just means no ping.
      - name: Find pages changed for IndexNow
        id: indexnow
        continue-on-error: true
        run: echo "payload=$(node scripts/indexnow.mjs)" >> "$GITHUB_OUTPUT"

      # Visual regression deliberately does not run here — baselines are
      # macOS-generated and Ubuntu rasterises text differently. See #44.

      # actions/deploy-pages needs the custom domain baked into the
      # artifact itself — unlike peaceiris/actions-gh-pages there is no
      # `cname` input to do this for us.
      - name: Add custom domain
        run: cp CNAME _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tells IndexNow (Bing, Yandex, Seznam...) which pages this deploy changed
  # (#250). Soft by design: a failed ping never fails the deploy.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow-payload != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: {}

    steps:
      - name: Ping IndexNow
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow-payload }}
        run: >-
          curl --fail-with-body -sS --max-time 30
          -X POST https://api.indexnow.org/indexnow
          -H 'Content-Type: application/json; charset=utf-8'
          --data "$PAYLOAD"
