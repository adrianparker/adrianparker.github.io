name: Build and deploy

on:
  push:
    branches:
      - master

# Never let two deploys race; the later push should win.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and coverage gate
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:headless

      - name: Validate HTML
        run: npm run lint:html

      # Visual regression deliberately does not run here — baselines are
      # macOS-generated and Ubuntu rasterises text differently. See #44.

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: www.adrianparker.com
