name: PR checks

# Verifies a change before it reaches master. There is no staging
# environment and merging deploys to production within about two minutes,
# so this is the only gate in front of the live site.
#
# Deliberately has no deploy step.

on:
  pull_request:
    branches:
      - master

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and coverage gate
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:headless

      # Visual regression is local-only; see #44 and TESTING.md.
